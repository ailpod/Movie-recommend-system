version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: movie-recommend-postgres
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
      POSTGRES_DB: moviedb
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movie-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: movie-recommend-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movie-network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: movie-recommend-backend
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://movieuser:moviepass@postgres:5432/moviedb
      DATABASE_ECHO: "false"
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      
      # Redis 配置
      REDIS_URL: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: 20
      
      # 安全配置
      SECURITY_SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      SECURITY_ALGORITHM: HS256
      SECURITY_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # CORS 配置
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
      CORS_ALLOW_CREDENTIALS: "true"
      
      # 应用配置
      APP_TITLE: "电影推荐系统 API"
      APP_VERSION: "1.0.0"
      APP_DEBUG: "false"
      
      # OpenAI API (如果需要)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Python 环境
      PYTHONUNBUFFERED: 1
      
    volumes:
      - ./Backend/uploads:/app/uploads
      - ./Backend/static:/app/static
      - ./Backend/recommend.db:/app/recommend.db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - movie-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: movie-recommend-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - movie-network
    restart: unless-stopped

  # Celery Worker (可选，用于异步任务)
  celery-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: movie-recommend-celery-worker
    command: celery -A app.celery.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://movieuser:moviepass@postgres:5432/moviedb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./Backend/uploads:/app/uploads
      - ./Backend/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movie-network
    restart: unless-stopped

networks:
  movie-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
